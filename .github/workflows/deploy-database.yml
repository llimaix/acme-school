name: Deploy Database

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
  workflow_dispatch:

env:
  SERVER_PROJECT_DIR: /opt/acme-school

jobs:
  deploy-oracle:
    name: Deploy Oracle Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copiar archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "database/"
          target: ${{ env.SERVER_PROJECT_DIR }}
          overwrite: true

      - name: Ejecutar deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 15m
          script: |
            chmod +x /opt/acme-school/database/scripts/ci-deploy.sh
            /opt/acme-school/database/scripts/ci-deploy.sh

      - name: Resultado
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Oracle verificado y consistente"
          else
            echo "❌ Falló el deploy"
            exit 1
          fi
