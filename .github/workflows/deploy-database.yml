name: Deploy Database

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
  workflow_dispatch:

env:
  SERVER_PROJECT_DIR: /opt/acme-school

jobs:
  deploy-oracle:
    name: Deploy Oracle Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copiar archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "database/"
          target: ${{ env.SERVER_PROJECT_DIR }}
          overwrite: true

      - name: Levantar Oracle y ejecutar init-scripts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            cd ${{ env.SERVER_PROJECT_DIR }}/database

            echo "=== 1. Verificando Docker ==="
            docker --version
            docker compose version

            echo "=== 2. Levantando Oracle ==="
            docker compose up -d

            echo "=== 3. Esperando que Oracle esté healthy ==="
            timeout 300 bash -c 'until docker inspect --format="{{.State.Health.Status}}" acme-school-db 2>/dev/null | grep -q "healthy"; do echo "  Esperando Oracle..."; sleep 10; done'
            echo "Oracle está listo."

            echo "=== 4. Backup pre-deploy ==="
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            docker exec acme-school-db bash -c "
              expdp system/\${ORACLE_PASSWORD:-AcmeSchool2025}@FREEPDB1 \
                DIRECTORY=DATA_PUMP_DIR \
                DUMPFILE=pre_deploy_\${TIMESTAMP}.dmp \
                LOGFILE=pre_deploy_\${TIMESTAMP}.log \
                SCHEMAS=acme_school 2>/dev/null
            " || echo "  Backup skipped (schema may not exist yet)"

            echo "=== 5. Copiando scripts al contenedor ==="
            docker cp ./init-scripts/. acme-school-db:/opt/oracle/scripts/

            echo "=== 6. Script 01 - Schema (como SYSTEM) ==="
            docker exec acme-school-db bash -c "
              sqlplus -s system/\${ORACLE_PASSWORD:-AcmeSchool2025}@FREEPDB1 <<EOSQL
              WHENEVER SQLERROR CONTINUE;
              @/opt/oracle/scripts/01_create_schema.sql
              EXIT;
            EOSQL
            "

            echo "=== 7. Scripts 02+ (como acme_school) ==="
            for script in \$(ls ./init-scripts/0[2-9]_*.sql 2>/dev/null | sort); do
              BASENAME=\$(basename \$script)
              echo "  >> \$BASENAME"
              docker exec acme-school-db bash -c "
                sqlplus -s acme_school/AcmeSchool2025@FREEPDB1 <<EOSQL
                WHENEVER SQLERROR CONTINUE;
                @/opt/oracle/scripts/\$BASENAME
                EXIT;
              EOSQL
              "
            done

            echo "=== 8. Verificación final ==="
            docker exec acme-school-db bash -c "
              sqlplus -s acme_school/AcmeSchool2025@FREEPDB1 <<EOSQL
              SET LINESIZE 200
              SET PAGESIZE 50
              COLUMN table_name FORMAT A25
              COLUMN num_rows FORMAT 999999

              PROMPT
              PROMPT === TABLAS ===
              SELECT table_name FROM user_tables ORDER BY table_name;

              PROMPT
              PROMPT === CONTEO DE DATOS ===
              SELECT 'estudiante' AS tabla, COUNT(*) AS registros FROM estudiante UNION ALL
              SELECT 'docente', COUNT(*) FROM docente UNION ALL
              SELECT 'curso', COUNT(*) FROM curso UNION ALL
              SELECT 'periodo', COUNT(*) FROM periodo UNION ALL
              SELECT 'seccion', COUNT(*) FROM seccion UNION ALL
              SELECT 'inscripcion', COUNT(*) FROM inscripcion UNION ALL
              SELECT 'nota', COUNT(*) FROM nota;

              PROMPT
              PROMPT === OBJETOS INVALIDOS ===
              SELECT object_name, object_type, status FROM user_objects WHERE status != 'VALID';
              EXIT;
            EOSQL
            "

            echo ""
            echo "✅ Database deploy completado"

      - name: Resultado
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Database deploy exitoso"
          else
            echo "❌ Database deploy falló"
            exit 1
          fi
