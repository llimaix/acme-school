services:
  oracle-db:
    image: gvenzl/oracle-free:23-full
    container_name: acme-school-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-AcmeSchool2025}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - oracle-backups:/opt/oracle/backups
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    shm_size: '1g'

volumes:
  oracle-data:
    driver: local
  oracle-backups:
    driver: local
